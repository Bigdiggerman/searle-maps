<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
/* Searle Forestry palette: sage #6f7c4a, deep forest #344414.
   UI chrome is brand-led; map feature colours stay tuned for legibility
   over aerial imagery, which is a functional requirement, not a brand one. */
:root{
  --bg:#0f120c; --panel:#171c12; --panel2:#1f2618; --line:#333d28;
  --ink:#eef1e6; --ink2:#a8b394; --ink3:#7b8768;
  --accent:#9aad6b; --sage:#6f7c4a; --forest:#344414;
  --boundary:#ffcc33;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font:13px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif;
  background:var(--bg); color:var(--ink); overflow:hidden;
}

/* ---------- shell ---------- */
#shell{display:flex;flex-direction:column;height:100vh}
header{
  display:flex;align-items:center;gap:20px;flex-wrap:nowrap;
  padding:13px 20px;flex:0 0 auto;
  background:linear-gradient(180deg,#1b2116 0%,var(--panel) 100%);
  border-bottom:2px solid var(--sage);
}
#brand{height:42px;width:auto;display:block;flex:0 0 auto}
.rule{width:1px;height:40px;background:var(--line);flex:0 0 auto}
.titleblock{display:flex;flex-direction:column;gap:1px;min-width:0}
header h1{
  font:400 30px/1.05 Georgia,"Times New Roman",serif;
  margin:0;letter-spacing:1.2px;text-transform:uppercase;color:var(--ink);
}
header h1 span{color:var(--accent);font-weight:400}
.sub{color:var(--ink2);font-size:12px;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header h1{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.titleblock{flex:0 0 auto;max-width:34vw}
.sub b{color:var(--accent);font-weight:600}
.spacer{flex:1}
@media (max-width:1100px){
  header h1{font-size:22px}
  #brand{height:32px}
  .sub{font-size:11px}
}
#brandfoot{
  flex:0 0 auto;border-top:2px solid var(--sage);padding:12px 14px;
  display:flex;align-items:center;gap:11px;
  background:linear-gradient(180deg,var(--panel) 0%,#1b2116 100%);
}
#brandfoot img{height:30px;opacity:1}
#brandfoot span{font-size:10.5px;color:var(--ink2);line-height:1.4}
#brandfoot b{color:var(--accent);font-size:11.5px;letter-spacing:.3px}
.basebar{display:flex;gap:4px;background:var(--panel2);padding:3px;border-radius:7px}
.basebar button{
  background:none;border:0;color:var(--ink2);font:inherit;font-size:11.5px;
  padding:4px 10px;border-radius:5px;cursor:pointer;
}
.basebar button:hover{color:var(--ink)}
.basebar button.on{background:var(--accent);color:#14190a;font-weight:600}
#main{display:flex;flex:1;min-height:0}

/* ---------- dashboard ---------- */
#dash{
  width:330px;flex:0 0 330px;background:var(--panel);border-right:1px solid var(--line);
  display:flex;flex-direction:column;min-height:0;
}
#dash.collapsed{width:0;flex-basis:0;overflow:hidden;border-right:0}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto}
.tabs button{
  flex:1;background:none;border:0;border-bottom:2px solid transparent;
  color:var(--ink3);font:inherit;font-size:11px;padding:9px 2px;cursor:pointer;
  text-transform:uppercase;letter-spacing:.4px;
}
.tabs button:hover{color:var(--ink2)}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
.tabpane{display:none;padding:14px;overflow-y:auto;flex:1;min-height:0}
.tabpane.on{display:block}

.card{background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:11px}
.card h3{
  margin:0 0 9px;font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;
  color:var(--ink3);font-weight:650;
}
.big{font-size:27px;font-weight:680;letter-spacing:-.5px;line-height:1.1}
.big small{font-size:12px;font-weight:400;color:var(--ink3);letter-spacing:0}
.kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px dotted #333d2866}
.kv:last-child{border-bottom:0}
.kv dt{color:var(--ink3);font-size:12px}
.kv dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:550;font-size:12px}
dl{margin:0}
.note{color:var(--ink3);font-size:11px;line-height:1.5;margin:8px 0 0}
.pill{display:inline-block;padding:1px 7px;border-radius:20px;font-size:10.5px;font-weight:600}

/* bars */
.bar{height:7px;border-radius:4px;background:#2a3320;overflow:hidden;margin:5px 0 2px}
.bar i{display:block;height:100%;border-radius:4px}
.barrow{margin-bottom:11px}
.barrow .lbl{display:flex;justify-content:space-between;font-size:11.5px;color:var(--ink2)}
.barrow .lbl b{color:var(--ink);font-variant-numeric:tabular-nums}

table.mini{width:100%;border-collapse:collapse;font-size:11.5px;font-variant-numeric:tabular-nums}
table.mini th{text-align:right;color:var(--ink3);font-weight:600;padding:5px 4px;border-bottom:1px solid var(--line);font-size:10.5px}
table.mini th:first-child{text-align:left}
table.mini td{text-align:right;padding:5px 4px;border-bottom:1px dotted #333d2866}
table.mini td:first-child{text-align:left}
table.mini tr:last-child td{border-bottom:0}
table.mini tfoot td{font-weight:700;border-top:1px solid var(--line);border-bottom:0;padding-top:7px}

/* data room */
.doc{display:flex;gap:9px;align-items:flex-start;padding:6px 0;border-bottom:1px dotted #333d2866}
.doc:last-of-type{border-bottom:0}
.ext{
  flex:0 0 38px;text-align:center;font-size:8.5px;font-weight:700;letter-spacing:.4px;
  padding:3px 0;border-radius:4px;border:1px solid;font-style:normal;margin-top:1px;
}
.docmeta{min-width:0;flex:1}
.docname{font-size:11.5px;color:var(--ink);line-height:1.35;word-break:break-word}
.docname a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.docname a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.docsub{font-size:10.5px;color:var(--ink3);line-height:1.4}
.docsub a{color:var(--ink2)}
b.int{
  font-size:8.5px;text-transform:uppercase;letter-spacing:.5px;font-weight:700;
  color:#ffa8a8;background:#e0313122;border:1px solid #e0313155;
  padding:0 4px;border-radius:3px;vertical-align:1px;
}
ul.notes{margin:0;padding-left:16px;color:var(--ink2);font-size:11.5px;line-height:1.6}
ul.notes li{margin-bottom:7px}
.warn{border-left:2px solid var(--accent);padding-left:9px;color:var(--ink2);font-size:11.5px;line-height:1.55;margin:9px 0}

/* ---------- map ---------- */
#mapwrap{flex:1;position:relative;min-width:0}
#map{position:absolute;inset:0;background:#0b0e08}
.leaflet-container{font:inherit;background:#0b0e08}

/* layer control */
#layers{
  position:absolute;top:10px;right:10px;z-index:900;width:272px;
  background:rgba(23,28,18,.95);border:1px solid var(--line);border-radius:9px;
  backdrop-filter:blur(8px);max-height:calc(100% - 20px);display:flex;flex-direction:column;
}
#layers header{
  background:none;border:0;border-bottom:1px solid var(--line);padding:8px 11px;
  font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--ink3);
  font-weight:650;cursor:pointer;display:flex;justify-content:space-between;align-items:center;
}
#layerbody{overflow-y:auto;padding:7px 6px 9px}
#layers.min #layerbody{display:none}
.grp{margin:0 0 6px}
.grp>p{margin:8px 5px 3px}
.grp>p label{
  display:flex;align-items:center;gap:6px;cursor:pointer;
  font-size:9.5px;text-transform:uppercase;letter-spacing:.6px;
  color:var(--ink3);font-weight:650;
}
.lyr{display:flex;align-items:center;gap:7px;padding:3px 6px;border-radius:5px;cursor:pointer}
.lyr:hover{background:#ffffff0a}
.lyr input[type=checkbox]{margin:0;accent-color:var(--accent);cursor:pointer;flex:0 0 auto}
.lyr .sw{width:15px;height:11px;border-radius:3px;flex:0 0 auto;border:1px solid #0006}
.lyr span{font-size:11.5px;color:var(--ink2);flex:1;line-height:1.3;min-width:0}
.lyr input[type=checkbox]:checked ~ span{color:var(--ink)}
.lyr.master{
  border-bottom:1px solid var(--line);margin:0 0 4px;padding-bottom:7px;border-radius:0;
}
.lyr.master span{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;
  color:var(--ink2);font-weight:650}
/* per-layer opacity: thin, unobtrusive, always reachable */
input.lop{
  flex:0 0 46px;width:46px;height:3px;margin:0;padding:0;cursor:pointer;
  accent-color:var(--sage);opacity:.5;transition:opacity .12s;
}
.lyr:hover input.lop{opacity:1}
input[type=checkbox]:checked ~ input.lop{opacity:.85}
.opa{display:flex;align-items:center;gap:7px;padding:8px 6px 2px;border-top:1px solid var(--line);margin-top:8px}
.opa label{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.5px}
.opa input{flex:1;accent-color:var(--accent)}
#basesel{
  background:var(--panel2);color:var(--ink);border:1px solid var(--line);
  border-radius:6px;padding:4px 6px;font:inherit;font-size:11px;cursor:pointer;
  min-width:0;max-width:150px;
}
#basesel:focus{outline:1px solid var(--accent)}
#basesel optgroup{background:var(--panel);color:var(--ink3);font-size:11px}
#basesel option{background:var(--panel);color:var(--ink)}

/* readouts */
#coords{
  position:absolute;left:10px;bottom:10px;z-index:900;
  background:rgba(23,28,18,.92);border:1px solid var(--line);border-radius:7px;
  padding:5px 10px;font-size:11px;color:var(--ink2);font-variant-numeric:tabular-nums;
}
#coords b{color:var(--ink);font-weight:600}

/* ---------- your location ---------- */
.locbtn{display:flex;align-items:center;justify-content:center;width:30px;height:30px}
.locbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.locbtn.on{color:#4dabf7!important}
.locbtn.wait svg{animation:locpulse 1s ease-in-out infinite}
@keyframes locpulse{50%{opacity:.35}}
#toast{
  position:absolute;left:50%;top:12px;transform:translateX(-50%);z-index:1100;
  background:rgba(23,28,18,.96);border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;font-size:12px;color:var(--ink);max-width:min(420px,calc(100% - 24px));
  box-shadow:0 4px 18px #0008;display:none;line-height:1.45;
}
#toast.on{display:block}
#coords .me{color:#74c0fc}
.leaflet-popup-content-wrapper{background:var(--panel);color:var(--ink);border-radius:9px;border:1px solid var(--line)}
.leaflet-popup-tip{background:var(--panel);border:1px solid var(--line)}
.leaflet-popup-content{margin:11px 13px;font-size:12px;min-width:190px}
.leaflet-popup-content h4{margin:0 0 7px;font-size:12.5px;color:var(--accent)}
.leaflet-popup-content .photolink img{
  display:block;width:100%;max-width:260px;border-radius:6px;margin:0 0 8px;
  border:1px solid var(--line);
}
.leaflet-popup-content a.btn,.card a.btn{
  display:inline-block;margin-top:8px;padding:5px 11px;border-radius:6px;
  background:var(--sage);color:#fff;text-decoration:none;font-size:11.5px;font-weight:600;
}
.leaflet-popup-content a.btn:hover,.card a.btn:hover{background:var(--accent);color:#14190a}
.leaflet-popup-content .kv dt{font-size:11.5px}
.leaflet-popup-content .kv dd{font-size:11.5px}
a.leaflet-popup-close-button{color:var(--ink3)!important}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-color:var(--line)}
.leaflet-bar a:hover{background:var(--panel2);color:var(--accent)}
.leaflet-control-attribution{background:rgba(23,28,18,.85)!important;color:var(--ink3)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--ink2)!important}
.leaflet-control-scale-line{background:rgba(23,28,18,.85);border-color:var(--line);color:var(--ink2)}

.blk-lbl{
  background:none;border:0;box-shadow:none;font-size:12px;font-weight:700;
  letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;
  text-shadow:0 0 4px #000,0 0 4px #000,0 0 8px #000;pointer-events:none;
}
.blkbtn{
  background:var(--panel2);border:1px solid var(--line);color:var(--ink2);
  border-radius:6px;padding:3px 7px;font:inherit;font-size:10.5px;cursor:pointer;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
}
.blkgroup{display:flex;flex-wrap:nowrap;gap:4px;flex:0 1 auto;min-width:0;overflow-x:auto;scrollbar-width:thin;padding-bottom:2px}
.blkbtn:hover{color:var(--ink);border-color:var(--sage)}
.blkbtn i{width:10px;height:10px;border-radius:2px;display:inline-block}
.blkrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sched td.bar{padding:0 4px}
.ctour-lbl{
  background:none;border:0;box-shadow:none;color:#e0c9a6;font-size:9.5px;
  font-weight:600;text-shadow:0 0 3px #000,0 0 3px #000;
}
.plotmk{border-radius:50%;border:1.5px solid #fff;box-shadow:0 0 0 1px #0008}
.owner-lbl{background:none;border:0;box-shadow:none;pointer-events:none}
.owner-lbl div{transform:translate(-50%,-50%);white-space:nowrap;font-size:10px;font-weight:600;
  color:#f1e6cf;text-shadow:0 0 3px #000,0 0 3px #000,0 0 6px #000;letter-spacing:.2px}
#toggleDash{
  background:var(--panel2);border:1px solid var(--line);color:var(--ink2);
  border-radius:6px;padding:4px 9px;font:inherit;font-size:11.5px;cursor:pointer;
}
#toggleDash:hover{color:var(--accent)}
/* contact agent: header on desktop, floating pill on phones */
.contact{display:flex;gap:6px;align-items:center;flex:0 0 auto}
.contact a{
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;white-space:nowrap;
  font-size:11.5px;font-weight:600;border-radius:6px;padding:5px 11px;border:1px solid var(--line);
}
.contact a.mail{background:var(--accent);color:#14190a;border-color:var(--accent)}
.contact a.mail:hover{background:#b3c57f}
.contact a.tel{background:var(--panel2);color:var(--ink);font-variant-numeric:tabular-nums}
.contact a.tel:hover{border-color:var(--sage);color:var(--accent)}
#contactfab{display:none}
#sheethandle{display:none}
/* ---------- small screens ----------
   Below 700px the three panels stack instead of sitting side by side: the
   map takes the whole viewport, the dashboard becomes a bottom sheet the
   menu button pulls up, and the overlay panel collapses to a pill. Nothing
   is dropped - it is the same content, reached one panel at a time. */
@media (max-width:900px) and (min-width:701px){
  #dash{width:290px;flex-basis:290px}
  #layers{width:230px}
}
@media (max-width:700px){
  header{padding:8px 10px;gap:10px;flex-wrap:nowrap}
  #brand{height:26px}
  .rule,.sub{display:none}
  .titleblock{flex:1;min-width:0}
  header h1{font-size:15px;letter-spacing:.6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .basebar{padding:2px}
  #toggleDash{flex:0 0 auto;padding:5px 9px}
  .spacer{display:none}
  #layers:not(.min){z-index:1001}
  .lyr{padding:5px 6px}
  .lyr span{font-size:12px}
  input.lop{flex:0 0 36px;width:36px;opacity:.7}
  .basebar.inpanel{margin:4px 5px 10px;display:block}
  .basebar.inpanel #basesel{width:100%;min-width:0;font-size:12px}
  .basebar.inpanel::before{
    content:"Base layer";display:block;font-size:9.5px;text-transform:uppercase;
    letter-spacing:.6px;color:var(--ink3);font-weight:650;margin:4px 0 5px;
  }
  #main{position:relative}
  #dash{
    position:absolute;left:0;right:0;bottom:0;top:auto;width:auto;flex:none;height:64%;
    z-index:1000;border-right:0;border-top:2px solid var(--sage);border-radius:14px 14px 0 0;
    box-shadow:0 -8px 24px #0009;transition:transform .22s ease;overflow:hidden;
  }
  #dash.collapsed{width:auto;flex-basis:auto;transform:translateY(100%)}
  #sheethandle{
    display:block;height:18px;flex:0 0 auto;cursor:pointer;position:relative;
  }
  #sheethandle::before{
    content:"";position:absolute;left:50%;top:7px;width:40px;height:4px;margin-left:-20px;
    border-radius:2px;background:var(--ink3);
  }
  .tabs{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:0 0 auto;padding:10px 13px;font-size:11.5px}
  .tabpane{padding:10px}
  #brandfoot{padding:8px 12px}
  #brandfoot img{height:22px}
  #layers{width:auto;left:10px;right:10px;max-height:56%}
  #layers.min{left:auto;width:auto}
  #layers header{padding:9px 12px;font-size:11px}
  #coords{display:none}
  .leaflet-popup-content{min-width:160px;max-width:78vw}
  #contacthdr{display:none}
  #contactfab{
    display:flex;position:absolute;left:10px;bottom:34px;z-index:900;gap:5px;
    background:rgba(23,28,18,.95);border:1px solid var(--line);border-radius:9px;
    padding:5px;backdrop-filter:blur(8px);
  }
  #contactfab a{padding:8px 11px;font-size:12px}
}
</style>

/* Blocks: each gets its own boundary colour and a label. A single-block
   property keeps the traditional yellow. Palette chosen for legibility over
   green imagery, not for brand. */
const BLOCK_PALETTE = ['#ffcc33', '#ff7ad9', '#4dd4ff', '#b5ff5c', '#ffa94d'];
const BLOCK_COLOUR = {};
BL.forEach((b, i) => { BLOCK_COLOUR[b.name] = b.colour || BLOCK_PALETTE[i % BLOCK_PALETTE.length]; });
const blockColour = name => BLOCK_COLOUR[name] || '#ffcc33';

const OWNERS = window.PROPMAP_OWNERS && Object.keys(window.PROPMAP_OWNERS).length ? window.PROPMAP_OWNERS : null;
const ownerOf = titles => {
  if (!OWNERS || !titles) return '';
  const names = [...new Set(String(titles).split(',').map(t => (OWNERS[t.trim()] || {}).owners).filter(Boolean))];

const esriAttr = 'Imagery: Esri, Vantor, GeoEye, Earthstar Geographics, CNES/Airbus DS, USDA, USGS, AeroGRID, IGN, and the GIS User Community';
const esriUrl = () => ESRI_KEY
  ? `https://ibasemaps-api.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}?token=${ESRI_KEY}`
  : 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}';
const esriOpts = {};

/* Historic surveys come from property.json (imagery_surveys), which is only
   ever filled from `stitch_imagery.py --probe` - so every entry here has
   been verified to actually serve tiles over the block. */
const BASES = STATIC_AERIAL ? [] : [
  ['Imagery', [
    ['Aerial — current', L.tileLayer(
      `https://basemaps.linz.govt.nz/v1/tiles/aerial/EPSG:3857/{z}/{x}/{y}.webp?api=${LINZ_BASEMAPS_KEY}`,
      {maxZoom: 19, maxNativeZoom: 19, attribution: linzAttr + ' Basemaps'})],
    ['Esri World Imagery', L.tileLayer(esriUrl(),
      Object.assign({maxZoom: 19, maxNativeZoom: 19, attribution: esriAttr}, esriOpts))],
  ].concat(SURVEYS.filter(s => s.source !== 'esri').map(s => [s.label || s.name,
      L.tileLayer(LDS(s.lds_layer_id), {maxZoom: 19, maxNativeZoom: s.max_native_zoom || 18,
                                        attribution: linzAttr})]))],
  ['Maps', [
    ['Topo 50', L.tileLayer(LDS(50767), {maxZoom: 18, maxNativeZoom: 16, attribution: 'Topo50 &copy; LINZ'})],
    ['Terrain relief', L.tileLayer(LDS(50765), {maxZoom: 18, maxNativeZoom: 15, attribution: 'Relief &copy; LINZ'})],
    ['OpenStreetMap', L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
      {maxZoom: 19, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'})],
  ]],
];
/* Baked imagery: several frames can share one name (a wide overview plus a
   detailed frame per block) and are shown as a single base layer. They sit
   in the tile pane so they can never paint over the vector overlays. */
/* Keyless context under the baked frames, so the hosted page still shows the
   rest of New Zealand when a viewer zooms out. Esri World Imagery and OSM
   both allow public embedding with attribution. Inside the claude.ai Artifact
   sandbox external tiles are blocked and these simply stay blank. */
const esriImagery = () => L.tileLayer(esriUrl(),
  Object.assign({maxZoom: 19, maxNativeZoom: 18, pane: 'tilePane',
                 attribution: 'Context ' + esriAttr.replace('Imagery:', 'imagery:')}, esriOpts));
const osmStreets = () => L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  {maxZoom: 19, pane: 'tilePane', attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'});
const SHARE_BASES = STATIC_AERIAL ? (() => {
  const byName = new Map();
  STATIC_AERIAL.forEach(a => { if (!byName.has(a.name)) byName.set(a.name, []); byName.get(a.name).push(a); });
  const items = [...byName.entries()].map(([n, frames], i) => [n, L.layerGroup(
    (i === 0 ? [esriImagery()] : []).concat(
    frames.map(a => L.imageOverlay(a.url, [[a.south, a.west], [a.north, a.east]],
      {attribution: linzAttr, pane: 'tilePane'}))))]);
  return [['Imagery', items], ['Maps', [
    ['OpenStreetMap', osmStreets()],
    ['Plain background', L.layerGroup()],
  ]]];
})() : null;

const USE = SHARE_BASES || BASES;
const baseByName = {};
USE.forEach(([, items]) => items.forEach(([n, l]) => { baseByName[n] = l; }));
const firstBase = USE[0][1][0][0];

let activeBase = baseByName[firstBase].addTo(map);

const sel = el('<select id="basesel" title="Base layer"></select>');
USE.forEach(([grp, items]) => {
  const og = el(`<optgroup label="${grp}"></optgroup>`);
  items.forEach(([n]) => og.appendChild(el(`<option>${n}</option>`)));
  sel.appendChild(og);
});
sel.onchange = () => {
  map.removeLayer(activeBase);
  activeBase = baseByName[sel.value].addTo(map);
  if (activeBase.bringToBack) activeBase.bringToBack();
};
document.getElementById('basebar').appendChild(sel);

L.control.scale({imperial: false, position: 'bottomright'}).addTo(map);

/* ===== styling ===== */
/* Age class gets a ramp built from the planting years actually present, so
   any property colours sensibly rather than relying on hard-coded years. */
const AGE_RAMP = ['#e8590c', '#f59f00', '#fcc419', '#94d82d', '#40c057'];
const AGE_COLOUR = (() => {
  const years = [...new Set((LAYERS.ets_caa?.features || [])
    .map(f => f.properties.YEAR_PLANT).filter(Boolean))].sort((a, b) => a - b);
  const m = {};
  years.forEach((y, i) => {
    m[y] = AGE_RAMP[Math.round(i * (AGE_RAMP.length - 1) / Math.max(1, years.length - 1))];
  });
  return m;
})();

/* MPI's own NES-CF erosion classes and the LUC ramp (good land green,
   marginal land brown), so the map reads the way the official tools do. */
const ESC_COLOUR = {
  'Low': '#40a02b', 'Moderate': '#d9a700',
  'High': '#e8590c', 'Very High': '#c92a2a',
  'other': '#868e96', 'shingle': '#adb5bd', 'water': '#4dabf7',
};
const LUC_COLOUR = {
  '1': '#2b8a3e', '2': '#2f9e44', '3': '#51cf66', '4': '#94d82d',
  '5': '#d8f000', '6': '#f59f00', '7': '#e8590c', '8': '#a15c2b',
};

function popup(title, rows) {
  return `<h4>${title}</h4><dl>${rows.filter(Boolean).join('')}</dl>`;
}

const boundarySwatch = BL.length > 1
  ? `linear-gradient(90deg,${BL.map(b => blockColour(b.name)).join(',')})`
  : '#ffcc33';

/* Layer definitions: key -> config.
   `on` = visible at first paint. `sw` = legend swatch colour. */
/* Exotic forest sits under Forest & carbon on a forest listing and under Land
   cover on a farm, where a woodlot is cover rather than the crop. */
const EXOTIC_DEF =
  {k: 'exotic_cover', n: 'Exotic forest (Topo50)', on: false, sw: '#ff2d95',
   style: () => ({color: '#ff2d95', weight: 2, fillColor: '#ff2d95', fillOpacity: .45}),
   pop: p => popup('Exotic forest (Topo50)', [kv('Species', p.species || '—')])};

const DEFS = [
  {grp: 'Property'},
  /* Non-interactive: it sits in the top pane and spans the whole property, so
     leaving it clickable would swallow every click meant for the layers below.
     Its detail is on the Overview tab instead. */
  {k: 'title_boundary', n: BL.length > 1 ? 'Block boundaries' : 'Title boundary',
   on: true, sw: boundarySwatch, pane: 'top', noclick: true,
   style: f => ({color: blockColour(f.properties.block), weight: 3, opacity: 1, fill: false})},

  {k: 'neighbour_parcels', n: 'Neighbouring parcels', on: false, sw: '#8899aa',
   style: () => ({color: '#8899aa', weight: 1, opacity: .75, fillOpacity: .04, fillColor: '#8899aa'}),
   pop: p => popup(p.appellation || 'Parcel', [
     kv('Title', p.titles || '—'),
     ownerOf(p.titles) ? kv('Owner', ownerOf(p.titles)) : '',
     kv('Intent', p.parcel_intent),
     kv('Area', fmt(p.calc_area / 10000, 2) + ' ha')])},
  /* Internal build only: owner names as labels on the neighbouring parcels
     (LINZ personal data licence - never in the share or hosted builds). */
  ...(OWNERS ? [{k: '__owner_labels', n: 'Neighbour owner names', on: false, sw: '#d9c8a6', point: true, noclick: true,
   mk: (f, ll) => L.marker(ll, {interactive: false, icon: L.divIcon({className: 'owner-lbl',
        html: `<div>${f.properties.owner}</div>`, iconSize: [0, 0]})}),
   style: () => ({})}] : []),

  ...(FARM ? [] : [{grp: 'Forest & carbon'}]),
  /* Stand layers: any LAYERS key beginning "stand_" (data/stand_<code>.geojson)
     becomes its own toggle. Scrub / unplanted is grey; each stand gets its own colour. */
  ...Object.keys(LAYERS).filter(k => k.startsWith('stand_')).map((k, i) => {
    const feats = LAYERS[k].features || [];
    const f0 = feats[0] || {properties: {}};
    const p0 = f0.properties;
    const STAND_COLOURS = ['#e8590c', '#f59f00', '#fcc419', '#94d82d', '#40c057', '#1c7ed6', '#ae3ec9'];
    const col = p0.stand === 'scrub' ? '#adb5bd' : STAND_COLOURS[i % STAND_COLOURS.length];
    // A file whose features carry `layer_label` is a per-block stand layer
    // (many stands in one toggle, first used on Roy Forests): name the toggle
    // by block, colour each piece by planting year, and outline pieces whose
    // status says they lie outside the title boundary.
    const perBlock = p0.layer_label !== undefined;
    const tot = feats.reduce((a, f) => a + (+f.properties.map_ha || 0), 0);
    const name = perBlock ? `${p0.layer_label} (${fmt(tot, 0)} ha, ${feats.length} pieces)`
               : p0.stand === 'scrub' ? (p0.label || 'Scrub / unplanted')
               : `${p0.label || k} — ${p0.year || ''} ${p0.species || ''}`.trim() + (p0.area_ha ? ` (${fmt(p0.area_ha, 1)} ha)` : '');
    const over = p => /outside/i.test(p.status || '');
    return {k, n: name, on: !perBlock, sw: perBlock ? 'linear-gradient(90deg,#e8590c,#f59f00,#94d82d)' : col,
      style: f => perBlock
        ? ({color: over(f.properties) ? '#ff3b3b' : '#ffffff', weight: over(f.properties) ? 2.2 : 0.8,
            dashArray: over(f.properties) ? '5,3' : null,
            fillColor: AGE_COLOUR[f.properties.year] || '#adb5bd', fillOpacity: .40})
        : ({color: col, weight: 1.6, fillColor: col, fillOpacity: p0.stand === 'scrub' ? .30 : .38,
            dashArray: p0.stand === 'scrub' ? '4,3' : null}),
      pop: p => popup(p.label || k, [
        p.species ? kv('Species', p.species) : '',
        p.year ? kv('Planted', p.year) : '',
        p.year ? kv('Age (2026)', (2026 - p.year) + ' yr') : '',
        kv(perBlock ? 'Stand area (register)' : 'Stand area', fmt(p.area_ha, 1) + ' ha'),
        p.map_ha ? kv(perBlock ? 'This piece' : 'Area on source map', p.map_ha + ' ha') : '',
        p.status ? kv('Status', p.status) : '',
        p.source ? kv('Source', p.source) : ''])};
  }),
  {k: 'ets_caa', n: 'ETS CAAs (age class)', on: true, sw: 'linear-gradient(90deg,#e8590c,#f59f00,#94d82d)',
   style: f => ({color: AGE_COLOUR[f.properties.YEAR_PLANT] || '#adb5bd', weight: 1.6,
                 fillColor: AGE_COLOUR[f.properties.YEAR_PLANT] || '#adb5bd', fillOpacity: .42}),
   pop: p => popup('CAA ' + p.CAA_NUM + ' — ' + p.YEAR_PLANT, [
     kv('Species', p.SPECIES), kv('Planted', p.YEAR_PLANT),
     kv('Age (2026)', p.age_2026 + ' yr'),
     kv('Mapped area', fmt(p.area_ha, 2) + ' ha')])},

  /* Violet, not red - red sits too close to the 1994 age-class orange to be
     readable where an ineligible pocket falls inside a CAA. */
  {k: 'ets_ineligible', n: 'ETS ineligible areas', on: true, sw: '#ae3ec9',
   style: () => ({color: '#ffffff', weight: 1.4, fillColor: '#ae3ec9',
                  fillOpacity: .55, dashArray: '4,3'}),
   pop: p => popup('Ineligible area ' + p.ISSUE_NUM, [
     kv('Status', p.ELIGIBILIT), kv('Within', 'CAA ' + p.CAA_NUM),
     kv('Area', fmt(p.area_ha, 2) + ' ha'), kv('Reason', p.ISSUE_CODE)])},

/* Vegetation overlays over aerial imagery (James Burke, 15 Sep 2026): small
   scattered polygons are fill-led (opacity ~.45, outline 2); large-area polygons
   are outline-led (opacity ~.14, outline 2.2); never an outline under 1.5 and no
   greens/browns for anything that must stand out on forested aerial. */
  ...(FARM ? [] : [EXOTIC_DEF]),

  {k: 'cruise_plots', n: 'Cruise plots', on: false, sw: '#da77f2', point: true,
   mk: (f, ll) => L.circleMarker(ll, {radius: 4, color: '#fff', weight: 1.2,
        fillColor: '#da77f2', fillOpacity: .95, className: 'plotmk'}),
   pop: p => popup('Cruise plot — stratum ' + p.StratumName, [
     kv('Altitude', p.Altitude ? p.Altitude + ' m' : '—'),
     kv('Measured', (p.LastMeasured || '').slice(0, 10))])},

  {grp: 'Access'},
  {k: 'legal_roads', n: 'Legal road parcels', on: true, sw: '#ff922b',
   style: () => ({color: '#ff922b', weight: 1.2, fillColor: '#ff922b', fillOpacity: .3}),
   pop: p => popup('Legal road', [kv('Appellation', p.appellation || '—'),
     kv('Area', fmt(p.calc_area / 10000, 2) + ' ha')])},

  {k: 'road_centrelines', n: 'Formed roads', on: true, sw: '#ffffff',
   style: () => ({color: '#ffffff', weight: 2.4, opacity: .9}),
   pop: p => popup(p.name || 'Road', [kv('Surface', p.surface || '—'),
     kv('Status', p.status || '—'), kv('Lanes', p.lane_count || '—')])},

  {k: 'tracks', n: '4WD tracks & foot tracks', on: true, sw: '#ffd43b',
   style: () => ({color: '#ffd43b', weight: 1.9, opacity: .95, dashArray: '6,4'}),
   pop: p => popup(p.name || 'Track', [kv('Type', p.track_type || '—'),
     kv('Use', p.track_use || '—'), kv('Status', p.status || '—')])},

  {grp: 'Terrain & water'},
  /* Contours start off on a multi-block sale: at the zoom that shows both
     blocks they are a solid brown wash over the imagery. */
  {k: 'contours', n: 'Contours (20 m)', on: BL.length <= 1, sw: '#b08968',
   style: f => {
     const idx = f.properties.elevation % 100 === 0;
     return {color: idx ? '#c9a227' : '#b08968', weight: idx ? 1.2 : .6,
             opacity: idx ? .95 : .6, fill: false};
   },
   pop: p => popup(p.elevation + ' m contour', [])},

  {k: 'rivers', n: 'Rivers & streams', on: true, sw: '#4dabf7',
   style: () => ({color: '#4dabf7', weight: 1.3, opacity: .9})},

  {k: 'river_polygons', n: 'River channels (Topo50)', on: true, sw: '#1c7ed6',
   style: () => ({color: '#1c7ed6', weight: 1, fillColor: '#1c7ed6', fillOpacity: .55})},

  {grp: 'Regulatory'},
  /* ESC is the layer that decides what a purchaser can do without consent
     under the NES-CF, so it leads this group. Colours follow MPI's own
     green / yellow / orange / red convention — do not restyle them. */
  {k: 'nes_esc', n: 'Erosion susceptibility (NES-CF)', on: false,
   sw: 'linear-gradient(90deg,#40a02b,#d9a700,#e8590c,#c92a2a)',
   style: f => {
     const c = ESC_COLOUR[f.properties.ESC2018] || '#868e96';
     return {color: c, weight: .8, fillColor: c, fillOpacity: .45};
   },
   pop: p => popup('ESC — ' + (p.ESC2018 || 'unclassified'), [
     kv('LUC unit', p.LUC || '—'),
     kv('Class 8e', p.Class8e === 'Yes' ? 'Yes — consent required' : (p.Class8e || '—')),
     kv('Area', fmt(p.area_ha, 2) + ' ha')])},

  {k: 'luc', n: 'Land Use Capability', on: false,
   sw: 'linear-gradient(90deg,#2f9e44,#94d82d,#f59f00,#a15c2b)',
   style: f => {
     const c = LUC_COLOUR[f.properties.luc_class] || '#868e96';
     return {color: c, weight: .8, fillColor: c, fillOpacity: .42};
   },
   pop: p => popup('LUC ' + (p.luc_subclass || p.luc_class || '—'), [
     p.nzcu_description ? `<div class="note" style="margin:0 0 7px">${p.nzcu_description}</div>` : '',
     kv('Class', p.luc_class || '—'),
     p.luc ? kv('Unit', p.luc) : '',
     p.slope ? kv('Slope', p.slope) : '',
     p.present_erosion ? kv('Present erosion', p.present_erosion) : '',
     p.potential_erosion ? kv('Potential erosion', p.potential_erosion) : '',
     kv('Area', fmt(p.area_ha, 2) + ' ha')])},

  {k: 'fish_spawning', n: 'Fish spawning reaches (NES-CF)', on: false, sw: '#4dabf7',
   style: () => ({color: '#74c0fc', weight: 2.6, opacity: .95}),
   pop: p => popup(p.CommonName || 'Spawning reach', [
     kv('Species', p.Species || '—'),
     kv('Spawning window', [p.SpawnFdate, p.SpawnTdate].filter(Boolean).join(' – ') || '—'),
     kv('Sensitivity', p.Sensitivity || '—')])},

  {grp: FARM ? 'Land cover' : 'Land cover & neighbours'},
  {k: 'native_cover', n: 'Native bush', on: FARM, sw: '#00e676',
   style: () => ({color: '#00e676', weight: 2.2, fillColor: '#00e676', fillOpacity: .14})},

  {k: 'scrub_cover', n: 'Scrub (manuka / kanuka)', on: false, sw: '#ffd400',
   style: () => ({color: '#ffd400', weight: 2.2, fillColor: '#ffd400', fillOpacity: .14})},
  ...(FARM ? [EXOTIC_DEF] : []),

  {k: 'protected_areas', n: 'DOC conservation land', on: true, sw: '#2f9e44',
   style: () => ({color: '#2f9e44', weight: 1.4, fillColor: '#2f9e44', fillOpacity: .16}),
   pop: p => popup(p.name || 'Protected area', [
     kv('Type', p.type || '—'), kv('Section', p.section || '—'),
     kv('Area', p.gis_area_ha ? fmt(p.gis_area_ha, 0) + ' ha' : '—')])},

  {grp: 'Reference'},
  {k: 'place_names', n: 'Place names', on: false, sw: '#dee2e6', point: true,
   mk: (f, ll) => L.marker(ll, {icon: L.divIcon({className: 'ctour-lbl',
        html: `<div style="white-space:nowrap;font-size:11px">${f.properties.name}</div>`,
        iconSize: [0, 0]})}),
   pop: p => popup(p.name, [kv('Feature', p.feat_type || '—')])},

  /* Photo popups: a thumbnail when the build carries one, and a link to the
     photo itself. Which link depends on the build - the builder fills
     `href` (and `thumb_src`) per photo; see build_*.py. */
  {k: '__photos', n: 'Aerial photo points', on: false, sw: '#f783ac', point: true,
   /* 360-degree panoramas get a bigger blue pin and open the hosted
      Kuula post rather than the flat equirectangular frame. */
   mk: (f, ll) => f.properties.pano_url
     ? L.circleMarker(ll, {radius: 6, color: '#fff', weight: 1.6,
        fillColor: '#4dabf7', fillOpacity: .95})
     : L.circleMarker(ll, {radius: 3.5, color: '#fff', weight: 1,
        fillColor: '#f783ac', fillOpacity: .95}),
   pop: p => popup((p.pano_url ? '360° panorama · ' : '')
       + (p.taken ? p.taken.replace(/:(\d\d):(\d\d) /, '-$1-$2 ') : p.file), [
     p.thumb_src
       ? `<a href="${p.pano_url || p.href || '#'}" target="_blank" rel="noopener" class="photolink">
            <img src="${p.thumb_src}" alt="" loading="lazy"
                 onerror="this.closest('.photolink').remove()"></a>`
       : '',
     kv('Altitude', p.alt_m != null ? p.alt_m + ' m' : '—'),
     kv('File', p.file),
     p.pano_url
       ? `<a class="btn" href="${p.pano_url}" target="_blank" rel="noopener">Look around in 360° &rarr;</a>`
       : '',
     p.href && !p.pano_url
       ? `<a class="btn" href="${p.href}" target="_blank" rel="noopener">Open photo &rarr;</a>`
       : (p.href ? '' : `<div class="note">${p.rel}</div>`)])},
];
if (FARM) {
  const forestOnly = d => d.k && (['ets_caa', 'ets_ineligible', 'cruise_plots', 'fish_spawning'].includes(d.k)
                                  || d.k.startsWith('stand_'));
  for (let i = DEFS.length - 1; i >= 0; i--) if (forestOnly(DEFS[i])) DEFS.splice(i, 1);
}

/* build layers */
const built = {};

/* Owner labels: one per neighbouring parcel of 5 ha or more that carries an
   owner in the (internal-only) owners table, placed at the parcel's centre. */
if (OWNERS && LAYERS.neighbour_parcels) {
  LAYERS.__owner_labels = {type: 'FeatureCollection', features: LAYERS.neighbour_parcels.features
    .filter(f => (f.properties.calc_area || 0) >= 50000 && ownerOf(f.properties.titles))
    .map(f => {
      const c = L.geoJSON(f).getBounds().getCenter();
      const o = ownerOf(f.properties.titles);
      return {type: 'Feature', geometry: {type: 'Point', coordinates: [c.lng, c.lat]},
              properties: {owner: o.length > 48 ? o.slice(0, 46) + '…' : o}};
    })};
}

/* Per-layer visibility + opacity. Opacity multiplies the layer's own base
   style, so a layer drawn at 30% fill stays proportionally lighter as the
   slider moves rather than jumping to a flat value. */
const state = {};
let masterOp = 1;
DEFS.forEach(d => { if (!d.grp) state[d.k] = {vis: !!d.on, op: 1}; });

function styleFor(d, f, bump) {
  const s = Object.assign({}, d.style(f));
  const m = state[d.k].op * masterOp;
  s.opacity = (s.opacity != null ? s.opacity : 1) * m;
  if (s.fillOpacity != null) s.fillOpacity *= m;
  if (bump) s.weight = (s.weight || 1) + 1.6;
  return s;
}

const topPane = map.createPane('topline');
topPane.style.zIndex = 650;
// The canvas renderer gives this pane its own full-size canvas, which would
// otherwise swallow every click before it reaches the layers underneath.
// Nothing in this pane is interactive, so let events pass straight through.
topPane.style.pointerEvents = 'none';

DEFS.forEach(d => {
  if (d.grp) return;
  const src = d.k === '__photos' ? PHOTOS : LAYERS[d.k];
  if (!src || !src.features || !src.features.length) { d.empty = true; return; }

  const opts = {
    style: d.style,
    interactive: !d.noclick,
    pane: d.pane === 'top' ? 'topline' : undefined,
    pointToLayer: d.point ? d.mk : undefined,
    onEachFeature: (f, lyr) => {
      if (d.noclick) return;
      if (d.pop) lyr.bindPopup(d.pop(f.properties));
      else if (d.k === 'rivers') lyr.bindPopup(popup('Watercourse', []));
      if (!d.point && d.k !== 'contours') {
        lyr.on('mouseover', e => { try { e.target.setStyle(styleFor(d, f, true)); } catch (_) {} });
        lyr.on('mouseout',  e => { try { e.target.setStyle(styleFor(d, f)); } catch (_) {} });
      }
    },
  };
  built[d.k] = L.geoJSON(src, opts);
  if (d.on) built[d.k].addTo(map);
});

/* Block name labels, for multi-block sales. Non-interactive, always on. */
if (BL.length > 1) {
  const labels = L.layerGroup();
  BL.forEach(b => {
    if (!b.centroid) return;
    labels.addLayer(L.marker(b.centroid, {interactive: false, pane: 'topline',
      icon: L.divIcon({className: 'blk-lbl',
        html: `<div style="color:${blockColour(b.name)}">${b.name}</div>`, iconSize: [0, 0]})}));
  });
  labels.addTo(map);
}

/* contour elevation labels on index contours, only when zoomed in */
const clabels = L.layerGroup();
(LAYERS.contours ? LAYERS.contours.features : []).forEach(f => {
  if (f.properties.elevation % 100 !== 0) return;

    className: 'ctour-lbl', html: f.properties.elevation, iconSize: [26, 11]})}));

function syncLabels() {
  const want = map.getZoom() >= 14 && map.hasLayer(built.contours);

/* ===== layer control =====
   Every overlay has its own tick box and its own opacity slider; groups and
   the whole panel can be ticked or faded in one go. Effective opacity for a
   layer is its own slider multiplied by the master slider. */
const lb = document.getElementById('layerbody');
const rows = {};                       // key -> {cb, slider}
const groups = [];                     // {name, keys[], cb}

function effOp(k) { return state[k].op * masterOp; }

function restyle(d) {
  const g = built[d.k];
  if (!g) return;
  g.eachLayer(l => {
    if (l.setStyle && l.feature && d.style) l.setStyle(styleFor(d, l.feature));
    else if (l.setOpacity) l.setOpacity(effOp(d.k));
  });

function setVisible(d, on) {
  state[d.k].vis = on;
  if (on) built[d.k].addTo(map); else map.removeLayer(built[d.k]);
  if (rows[d.k]) rows[d.k].cb.checked = on;

}

function refreshGroupBoxes() {
  groups.forEach(g => {
    const on = g.keys.filter(k => state[k].vis).length;
    g.cb.checked = on > 0;
    g.cb.indeterminate = on > 0 && on < g.keys.length;
  });
  const all = Object.keys(state);
  const on = all.filter(k => state[k].vis).length;
  masterCb.checked = on > 0;
  masterCb.indeterminate = on > 0 && on < all.length;
}

DEFS.forEach(d => {
  if (d.grp) {
    const box = el(`<div class="grp"><p><label><input type="checkbox">${d.grp}</label></p></div>`);
    const cb = box.querySelector('input');
    const g = {name: d.grp, keys: [], cb};
    cb.onchange = () => {
      DEFS.filter(x => !x.grp && !x.empty && g.keys.includes(x.k))
          .forEach(x => setVisible(x, cb.checked));
      refreshGroupBoxes();
    };
    groups.push(g);
    lb.appendChild(box);
    current = g;
    return;

  if (d.empty) return;

  const row = el(`<div class="lyr">
      <input type="checkbox"${d.on ? ' checked' : ''}>
      <i class="sw" style="background:${d.sw}"></i>
      <span>${d.n}</span>

  rows[d.k] = {cb, slider};

  cb.onchange = () => { setVisible(d, cb.checked); refreshGroupBoxes(); };
  slider.oninput = () => {
    state[d.k].op = slider.value / 100;
    restyle(d);
  };

  if (current) current.keys.push(d.k);

/* NZTM readout — Transverse Mercator forward, NZGD2000 / EPSG:2193. */
function toNZTM(lat, lon) {
  const a = 6378137, f = 1 / 298.257222101, k0 = 0.9996;
  const lat0 = 0, lon0 = 173 * Math.PI / 180, E0 = 1600000, N0 = 10000000;
  const e2 = 2 * f - f * f, ep2 = e2 / (1 - e2);
  const p = lat * Math.PI / 180, l = lon * Math.PI / 180;
  const N = a / Math.sqrt(1 - e2 * Math.sin(p) ** 2);
  const T = Math.tan(p) ** 2, C = ep2 * Math.cos(p) ** 2, A = (l - lon0) * Math.cos(p);
  const n = f / (2 - f);
  const G = a * (1 - n) * (1 - n * n) * (1 + 9 / 4 * n * n + 225 / 64 * n ** 4) * Math.PI / 180;
  const M = a * ((1 - e2 / 4 - 3 * e2 * e2 / 64 - 5 * e2 ** 3 / 256) * p
    - (3 * e2 / 8 + 3 * e2 * e2 / 32 + 45 * e2 ** 3 / 1024) * Math.sin(2 * p)
    + (15 * e2 * e2 / 256 + 45 * e2 ** 3 / 1024) * Math.sin(4 * p)
    - (35 * e2 ** 3 / 3072) * Math.sin(6 * p));
  const M0 = 0;
  const E = E0 + k0 * N * (A + (1 - T + C) * A ** 3 / 6
    + (5 - 18 * T + T * T + 72 * C - 58 * ep2) * A ** 5 / 120);
  const Nn = N0 + k0 * (M - M0 + N * Math.tan(p) * (A * A / 2 + (5 - T + 9 * C + 4 * C * C) * A ** 4 / 24
    + (61 - 58 * T + T * T + 600 * C - 330 * ep2) * A ** 6 / 720));
  return [Math.round(E), Math.round(Nn)];
}
const co = document.getElementById('coords');
function readout(lat, lon) {
  const [e, n] = toNZTM(lat, lon);
  co.innerHTML = `<b>${lat.toFixed(5)}, ${lon.toFixed(5)}</b> &nbsp;·&nbsp; NZTM <b>${fmt(e)}E ${fmt(n)}N</b>`;
}
map.on('mousemove', e => readout(e.latlng.lat, e.latlng.lng));
readout(P.centroid[0], P.centroid[1]);

/* ===== your location =====
   A tap-to-start "where am I" for phones and tablets out on the property.
   The browser asks the viewer's permission first; the position is drawn on
   this device only and is never sent anywhere. Browsers only offer location
   to pages served over https (a hosted copy or the share link) - a file
   opened from an email attachment will not get one. */
const toastEl = document.getElementById('toast');
let toastTimer = null;
function toast(msg, ms = 6000) {
  toastEl.innerHTML = msg;
  toastEl.classList.add('on');
  clearTimeout(toastTimer);
  if (ms) toastTimer = setTimeout(() => toastEl.classList.remove('on'), ms);
}
toastEl.onclick = () => toastEl.classList.remove('on');

const mePane = map.createPane('me');
mePane.style.zIndex = 660;
mePane.style.pointerEvents = 'none';
const meAcc = L.circle([0, 0], {radius: 1, pane: 'me', interactive: false,
  color: '#4dabf7', weight: 1, opacity: .7, fillColor: '#4dabf7', fillOpacity: .13});
const meDot = L.circleMarker([0, 0], {radius: 7, pane: 'me', interactive: false,
  color: '#ffffff', weight: 2.5, fillColor: '#1c7ed6', fillOpacity: 1});
let locating = false, hadFix = false, locBtn = null, lastFix = null;

function haversineKm(a, b) {
  const R = 6371, rad = Math.PI / 180;
  const dLat = (b.lat - a.lat) * rad, dLon = (b.lng - a.lng) * rad;
  const h = Math.sin(dLat / 2) ** 2 +
    Math.cos(a.lat * rad) * Math.cos(b.lat * rad) * Math.sin(dLon / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}

function stopLocating(msg) {
  locating = false; hadFix = false;
  map.stopLocate();
  [meAcc, meDot].forEach(l => map.hasLayer(l) && map.removeLayer(l));
  if (locBtn) locBtn.classList.remove('on', 'wait');
  readout(P.centroid[0], P.centroid[1]);
  if (msg) toast(msg);
}

function startLocating() {
  if (!('geolocation' in navigator)) {
    toast('This browser cannot share its location.');
    return;
  }
  if (window.isSecureContext === false) {
    toast('Location only works when the map is opened from its web link ' +
          '(https), not from a file saved to the device.');
    return;
  }
  locating = true; hadFix = false;
  locBtn.classList.add('on', 'wait');
  toast('Finding your location&hellip; allow location access if your browser asks.', 0);
  map.locate({watch: true, setView: false, enableHighAccuracy: true,
              maximumAge: 5000, timeout: 20000});
}

map.on('locationfound', e => {
  if (!locating) return;
  lastFix = e;
  meAcc.setLatLng(e.latlng).setRadius(e.accuracy);
  meDot.setLatLng(e.latlng);
  if (!map.hasLayer(meAcc)) meAcc.addTo(map);
  if (!map.hasLayer(meDot)) meDot.addTo(map);
  locBtn.classList.remove('wait');

  const [ex, ny] = toNZTM(e.latlng.lat, e.latlng.lng);
  co.innerHTML = `<span class="me">You</span> <b>${e.latlng.lat.toFixed(5)}, ${e.latlng.lng.toFixed(5)}</b>`
    + ` &nbsp;·&nbsp; &plusmn;${fmt(e.accuracy)} m &nbsp;·&nbsp; NZTM <b>${fmt(ex)}E ${fmt(ny)}N</b>`;

  if (hadFix) return;            // after the first fix, follow quietly
  hadFix = true;
  const frame = L.latLngBounds([[P.bbox[1], P.bbox[0]], [P.bbox[3], P.bbox[2]]]);
  const centre = L.latLng(P.centroid[0], P.centroid[1]);
  if (frame.contains(e.latlng)) {
    map.setView(e.latlng, Math.max(map.getZoom(), 16));
    const inside = built.title_boundary && pointInTitle(e.latlng);
    toast((inside ? 'You are <b>on the property</b>.' : 'You are near the property, outside the boundary.')
      + ` Accuracy about &plusmn;${fmt(e.accuracy)} m &mdash; good enough to find your way, `
      + 'not to locate a boundary peg. Tap the button again to stop.', 9000);
  } else {
    const km = haversineKm(e.latlng, centre);
    if (km < 60) {
      map.fitBounds(L.latLngBounds([e.latlng, centre]).pad(0.15));
    }
    toast(`You are about <b>${fmt(km, km < 10 ? 1 : 0)} km</b> from the property. `
      + 'Your position will update as you travel. Tap the button again to stop.', 9000);
  }
});

map.on('locationerror', e => {
  if (!locating) return;
  if (e.code === 1) {
    stopLocating('Location access was declined. To use it, allow location for '
      + 'this page in your browser or phone settings, then tap the button again.');
  } else if (e.code === 3 && !hadFix) {
    toast('Still waiting for a GPS fix &mdash; this can take longer under bush '
      + 'or in a valley. It will appear as soon as there is one.', 8000);
  } else if (!hadFix) {
    stopLocating('Your location is not available right now. Check location '
      + 'services are on, then try again.');
  }
});

/* Point-in-polygon against the title boundary, so the first message can say
   whether the viewer is actually on the land. Ray casting on lat/lng is fine
   at property scale. */
function pointInTitle(ll) {
  const x = ll.lng, y = ll.lat;
  let inside = false;
  const test = ring => {
    for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
      const [xi, yi] = ring[i], [xj, yj] = ring[j];
      if ((yi > y) !== (yj > y) && x < (xj - xi) * (y - yi) / (yj - yi) + xi) inside = !inside;
    }
  };
  (LAYERS.title_boundary.features || []).forEach(f => {
    const g = f.geometry; if (!g) return;
    const polys = g.type === 'Polygon' ? [g.coordinates] : g.type === 'MultiPolygon' ? g.coordinates : [];
    polys.forEach(rings => rings.forEach(test));
  });
  return inside;
}

if (CROP && !FARM) {

  const totalCrop = ac.reduce((s, r) => s + (r.ha || 0), 0);
  const blocksIn = [...new Set(ac.map(r => r.block).filter(Boolean))];
  const years = [...new Set(ac.map(r => r.year))].sort();
  const ageRamp = {};
  years.forEach((y, i) => {
    ageRamp[y] = AGE_RAMP[Math.round(i * (AGE_RAMP.length - 1) / Math.max(1, years.length - 1))];
  });
  const lr = CROP.land_return || [];
  const lrBlocks = [...new Set(lr.flatMap(r => Object.keys(r.areas || {})))];
  const lrTotal = b => lr.reduce((s, r) => s + ((r.areas || {})[b] || 0), 0);
  const lrAll = lr.reduce((s, r) => s + Object.values(r.areas || {}).reduce((a, v) => a + v, 0), 0);
  const lrMax = Math.max(1, ...lr.map(r => Object.values(r.areas || {}).reduce((a, v) => a + v, 0)));

  document.getElementById('pane-crop').innerHTML = `
    <div class="card">
      <h3>${CROP.title || 'Existing tree crop'}</h3>
      <div class="big">${fmt(totalCrop, 1)}<small> ha net stocked</small></div>
      ${(CROP.summary || []).length ? `<dl style="margin-top:9px">${CROP.summary.map(r => kv(r.k, r.v)).join('')}</dl>` : ''}
      ${CROP.intro ? `<p class="note">${CROP.intro}</p>` : ''}
    </div>

    ${ac.length ? `<div class="card">
      <h3>Age class</h3>
      <table class="mini">
        <thead><tr>${blocksIn.length ? '<th>Block</th>' : ''}<th>Planted</th><th>Age</th><th>Species</th><th>NSA</th></tr></thead>
        <tbody>${ac.map(r => `<tr>
          ${blocksIn.length ? `<td><span style="color:${blockColour(r.block)}">${r.block}</span></td>` : ''}
          <td><span class="pill" style="background:${ageRamp[r.year]}33;color:${ageRamp[r.year]}">${r.year}</span></td>
          <td>${r.age != null ? r.age : '—'}</td><td>${r.species || '—'}</td>
          <td>${fmt(r.ha, 2)} ha</td></tr>`).join('')}
        </tbody>
        <tfoot>${blocksIn.map(b => `<tr><td>${b} subtotal</td><td></td><td></td><td></td>
            <td>${fmt(ac.filter(r => r.block === b).reduce((s, r) => s + r.ha, 0), 2)} ha</td></tr>`).join('')}
          <tr><td>Total</td>${blocksIn.length ? '<td></td>' : ''}<td></td><td></td><td>${fmt(totalCrop, 2)} ha</td></tr></tfoot>
      </table>
      ${CROP.age_note ? `<p class="note">${CROP.age_note}</p>` : ''}
    </div>` : ''}

    ${lr.length ? `<div class="card">
      <h3>${CROP.land_return_title || 'Land return schedule'}</h3>
      <div class="big">${fmt(lrAll, 1)}<small> ha to be returned</small></div>
      ${CROP.land_return_intro ? `<p class="note" style="margin-top:6px">${CROP.land_return_intro}</p>` : ''}
      <table class="mini sched" style="margin-top:8px">
        <thead><tr><th>Year</th>${lrBlocks.map(b => `<th>${b}</th>`).join('')}<th>Total</th><th></th></tr></thead>
        <tbody>${lr.map(r => {
          const tot = Object.values(r.areas || {}).reduce((a, v) => a + v, 0);
          return `<tr><td>${r.year}</td>${lrBlocks.map(b => `<td>${(r.areas || {})[b] ? fmt(r.areas[b], 1) : '—'}</td>`).join('')}
            <td>${tot ? fmt(tot, 1) : '—'}</td>
            <td class="bar" style="width:34%"><div class="bar" style="margin:0;display:flex;background:#2a3320">${lrBlocks.map(b =>
              `<i style="width:${((r.areas || {})[b] || 0) / lrMax * 100}%;background:${blockColour(b)};border-radius:0"></i>`).join('')}</div></td></tr>`;
        }).join('')}</tbody>
        <tfoot><tr><td>Total</td>${lrBlocks.map(b => `<td>${fmt(lrTotal(b), 1)}</td>`).join('')}<td>${fmt(lrAll, 1)}</td><td></td></tr></tfoot>
      </table>
      ${(CROP.land_return_notes || []).map(n => `<p class="note">${n}</p>`).join('')}
    </div>` : ''}

    ${(CROP.terms || []).length ? `<div class="card">
      <h3>${CROP.terms_title || 'Forestry right'}</h3>
      <dl>${CROP.terms.map(r => kv(r.k, r.v)).join('')}</dl>
      ${(CROP.terms_notes || []).map(n => `<p class="note">${n}</p>`).join('')}
    </div>` : ''}

    ${CROP.source ? `<div class="card"><h3>Source</h3><p class="note" style="margin-top:0">${CROP.source}</p></div>` : ''}`;
}

/* --- rates (only when a rating valuation is part of the sale) --- */
if (hasRates) {
  const rateRows = [
    ['Per hectare of title', money(R.rates_per_ha_title), fmt(P.title_area_ha_im, 2) + ' ha'],
    ['Per hectare effective', money(R.rates_per_ha_effective), fmt(C.effective_area_ha, 1) + ' ha'],
    ['Per hectare net stocked', money(R.rates_per_ha_stocked), fmt(C.net_stocked_pine_ha, 1) + ' ha'],
    ['Per hectare ETS registered', money(R.rates_per_ha_registered), fmt(E ? E.registered_ha : null, 2) + ' ha'],
    ['Per NZU transferring', money(R.rates_per_nzu, 3), fmt(E ? E.nzu_transferring : null) + ' NZU'],
  ].filter(r => r[1] !== '—');
  document.getElementById('pane-rates').innerHTML = `
    <div class="card">
      <h3>Annual rates — district + regional</h3>
      <div class="big">${money(R.total_annual)}<small> / year</small></div>
      <dl style="margin-top:9px">
        ${kv('Territorial authority', R.district_council)}
        ${kv('Regional council', R.regional_council)}
        ${R.rates_pct_of_cv != null ? kv('Rates as % of CV', fmt(R.rates_pct_of_cv, 3) + '%') : ''}
      </dl>
      ${R.split_available ? '' : `<div class="warn">The rates figure on file is the <b>combined</b>
      district and regional total. The split between ${R.district_council} and
      ${R.regional_council} is not in the property file — confirm from the rates
      notice before quoting a split to a buyer.</div>`}
      ${R.note ? `<p class="note">${R.note}</p>` : ''}
    </div>

    <div class="card">
      <h3>Rating valuation</h3>
      <dl>
        ${kv('Capital value (CV)', money(R.capital_value, 0))}
        ${kv('Land value (LV)', money(R.land_value, 0))}
        ${kv('Improvements (IV)', money(R.improvements_value, 0))}
        ${kv('CV per hectare', money(R.cv_per_ha, 0))}
        ${kv('LV per hectare', money(R.lv_per_ha, 0))}
      </dl>
      ${R.land_value != null ? `<div class="bar" style="margin-top:11px">
        <i style="width:${R.land_value / R.capital_value * 100}%;background:#f59f00"></i>
      </div>
      <p class="note" style="margin-top:4px">Land is
      ${fmt(R.land_value / R.capital_value * 100, 1)}% of capital value; improvements are
      ${money(R.improvements_value, 0)}.${NARR.rates_note ? ' ' + NARR.rates_note : ''}</p>` :
      `<p class="note" style="margin-top:4px">The land / improvements split is not on file for every title.${NARR.rates_note ? ' ' + NARR.rates_note : ''}</p>`}
    </div>

    <div class="card">
      <h3>Rates intensity</h3>
      <table class="mini">
        <thead><tr><th>Basis</th><th>Rate</th><th>Denominator</th></tr></thead>
        <tbody>${rateRows.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td>
          <td style="color:var(--ink3)">${r[2]}</td></tr>`).join('')}</tbody>
      </table>
      ${R.rates_per_nzu ? `<p class="note">Rates are ${money(R.rates_per_nzu, 3)} per NZU
      transferring on settlement.</p>` : ''}
    </div>

    <div class="card">
      <h3>Source</h3>
      <p class="note" style="margin-top:0">${R.source}</p>
    </div>`;
}

/* --- ETS --- */
if (E) document.getElementById('pane-ets').innerHTML = hasCaas ? `
  <div class="card">
    <h3>Carbon position</h3>
    <div class="big">${fmt(E.nzu_transferring)}<small> NZU on settlement</small></div>
    <dl style="margin-top:9px">
      ${kv('Registered area', fmt(E.registered_ha, 2) + ' ha')}
      ${kv('Participant', E.participant || '—')}
      ${kv('Accounting', E.accounting || '—')}
      ${kv('Activity', E.activity || '—')}
      ${kv('Constituted', E.constitution_date || '—')}
      ${kv('Carbon tables', E.fma ? 'Participant-specific FMA' : 'Regional lookup')}
    </dl>
    ${E.status ? `<p class="note">${E.status}</p>` : ''}
  </div>

  <div class="card">
    <h3>Age class by CAA</h3>
    <table class="mini">
      <thead><tr><th>CAA</th><th>Planted</th><th>Age</th><th>Registered</th><th>NZU</th></tr></thead>
      <tbody>${E.caas.map(c => `<tr>
        <td><span class="pill" style="background:${AGE_COLOUR[c.planted] || '#adb5bd'}33;color:${AGE_COLOUR[c.planted] || '#adb5bd'}">CAA ${c.caa}</span></td>
        <td>${c.planted}</td><td>${c.age_2026} yr</td>
        <td>${fmt(c.registered_ha, 2)} ha</td><td>${fmt(c.nzu)}</td></tr>`).join('')}
      </tbody>
      <tfoot><tr><td>Total</td><td></td><td></td>
        <td>${fmt(E.registered_ha, 2)} ha</td><td>${fmt(E.nzu_transferring)}</td></tr></tfoot>
    </table>
    ${E.caas.map(c => `<div class="barrow" style="margin-top:9px">
      <div class="lbl"><span>CAA ${c.caa} · ${c.planted}</span><b>${fmt(c.nzu_per_ha, 1)} NZU/ha</b></div>
      <div class="bar"><i style="width:${c.registered_ha / E.registered_ha * 100}%;background:${AGE_COLOUR[c.planted] || '#adb5bd'}"></i></div>
    </div>`).join('')}
  </div>

  ${E.mapped_eligible_ha ? `<div class="card">
    <h3>Eligible vs ineligible (mapped)</h3>
    <dl>
      ${kv('Mapped eligible', fmt(E.mapped_eligible_ha, 2) + ' ha')}
      ${kv('Mapped ineligible', fmt(E.mapped_ineligible_ha, 2) + ' ha')}
      ${kv('Registered (CAA report)', fmt(E.registered_ha, 2) + ' ha')}
    </dl>
    ${Math.abs(E.registered_ha - E.mapped_eligible_ha) > 0.5 ? `<div class="warn">Registered area
    differs from the mapped eligible shapefile by
    ${fmt(Math.abs(E.registered_ha - E.mapped_eligible_ha), 2)} ha. The CAA land status report
    governs the carbon position; the shapefile is the mapping source. Worth
    reconciling before settlement.</div>` : ''}
    ${E.ineligible_reason ? `<p class="note">Ineligible area reason: <i>${E.ineligible_reason}</i>.</p>` : ''}
  </div>` : ''}` : `
  <div class="card">
    <h3>ETS position</h3>
    <div class="big">None<small> registered</small></div>
    <p class="note" style="margin-top:8px">${E.status ||
      'No ETS registration forms part of this sale. ETS status of the land to be confirmed.'}</p>
  </div>`;

/* --- land --- */
const rangeTxt = T.min_elevation_m != null
  ? `Contours on the title run from ${fmt(T.min_elevation_m)} m to ${fmt(T.max_elevation_m)} m.`
  : '';
document.getElementById('pane-terrain').innerHTML = `
  ${T.min_elevation_m != null ? `<div class="card">
    <h3>Relief</h3>
    <div class="big">${fmt(T.max_elevation_m - T.min_elevation_m)}<small> m of vertical</small></div>
    <dl style="margin-top:9px">
      ${kv('Lowest contour on title', fmt(T.min_elevation_m) + ' m')}
      ${kv('Highest contour on title', fmt(T.max_elevation_m) + ' m')}
      ${kv('Contour interval', T.contour_interval_m + ' m')}
      ${BL.length > 1 ? BL.map(b => kv(b.name, b.min_elevation_m != null ? fmt(b.min_elevation_m) + ' – ' + fmt(b.max_elevation_m) + ' m' : '—')).join('') : ''}
    </dl>
    <p class="note">${NARR.relief_note || rangeTxt}</p>
  </div>` : ''}

  <div class="card">
    <h3>Access</h3>
    <dl>
      ${kv('Tracks on title (Topo50)', fmt(A.track_km_on_property, 2) + ' km')}
      ${kv('Formed road on title', fmt(A.formed_road_km_on_property, 2) + ' km')}
      ${kv('Legal road parcels in frame', fmt(A.legal_road_parcels_nearby))}
    </dl>
    <div class="warn">${A.note}</div>
    <p class="note">${NARR.access_note || 'Topo50 records ' + fmt(A.track_km_on_property, 2) +
      ' km of track and ' + fmt(A.formed_road_km_on_property, 2) + ' km of formed road on the title. ' +
      (FARM ? 'Farm races and tracks are usually more extensive than the national topo layer records.'
            : 'Internal forestry roading is usually more extensive than the national topo layer records.')}</p>
  </div>

  ${!EV || !EV.esc.length ? '' : `
  <div class="card">
    <h3>Erosion susceptibility — NES-CF</h3>
    <div class="big">${fmt(EV.esc_high_ha, 1)}<small> ha high or very high</small></div>
    <p class="note" style="margin-top:6px">${FARM
      ? 'Relevant if any of the land is planted: the ESC sets what can be done without resource consent under the National Environmental Standards for Commercial Forestry, with heavier conditions on the orange and red classes.'
      : 'The ESC sets what a purchaser can do without resource consent under the National Environmental Standards for Commercial Forestry. Harvesting, earthworks and replanting on the orange and red classes carry the heavier conditions.'}</p>
    ${EV.esc.map(e => `<div class="barrow" style="margin-top:9px">
      <div class="lbl"><span>${e.key}</span><b>${fmt(e.ha, 1)} ha · ${fmt(e.pct, 1)}%</b></div>
      <div class="bar"><i style="width:${e.pct}%;background:${ESC_COLOUR[e.key] || '#868e96'}"></i></div>
    </div>`).join('')}
    ${BL.length > 1 ? `<table class="mini" style="margin-top:8px">
      <thead><tr><th>Block</th>${EV.esc.map(e => `<th>${e.key}</th>`).join('')}</tr></thead>
      <tbody>${BL.map(b => `<tr><td style="color:${blockColour(b.name)}">${b.name}</td>
        ${EV.esc.map(e => { const r = b.esc.find(x => x.key === e.key); return `<td>${r ? fmt(r.ha, 0) + ' ha' : '—'}</td>`; }).join('')}
      </tr>`).join('')}</tbody></table>` : ''}
    <p class="note">${EV.esc_source}.</p>
  </div>` }

  ${!EV || !EV.luc.length ? '' : `
  <div class="card">
    <h3>Land Use Capability</h3>
    <table class="mini">
      <thead><tr><th>Class</th><th>Area</th><th>Share</th>${BL.length > 1 ? BL.map(b => `<th>${b.name}</th>`).join('') : ''}</tr></thead>
      <tbody>${EV.luc.map(l => `<tr>
        <td><span class="pill" style="background:${(LUC_COLOUR[l.key] || '#868e96')}33;color:${LUC_COLOUR[l.key] || '#adb5bd'}">LUC ${l.key}</span></td>
        <td>${fmt(l.ha, 1)} ha</td><td>${fmt(l.pct, 1)}%</td>
        ${BL.length > 1 ? BL.map(b => { const r = b.luc.find(x => x.key === l.key); return `<td>${r ? fmt(r.ha, 0) : '—'}</td>`; }).join('') : ''}</tr>`).join('')}
      </tbody>
    </table>
    ${EV.luc_subclasses.length ? `<p class="note">Units present:
      ${EV.luc_subclasses.map(s => `${s.key} (${fmt(s.ha, 0)} ha)`).join(', ')}.</p>` : ''}
    ${(EV.luc_units || []).length ? `<p class="note">${EV.luc_units
      .map(u => `${u.key} — ${fmt(u.ha, 0)} ha`).join('<br>')}</p>` : ''}
    <p class="note">${EV.luc_source}. Higher class numbers mean greater physical
    limitation — ${FARM ? 'classes 1 to 4 suit cropping, 5 to 7 pastoral or forestry use, and 8 is best left in cover.'
      : '7 and 8 are steep or severely limited land, typically the reason a block is in trees rather than pasture.'}</p>
  </div>` }

  ${!EV || FARM || !EV.fish_spawning_reaches ? '' : `
  <div class="card">
    <h3>Fish spawning — NES-CF</h3>
    <dl>${kv('Indicator reaches in frame', fmt(EV.fish_spawning_reaches))}</dl>
    <p class="note">${EV.fish_species.length
      ? 'Species recorded: ' + EV.fish_species.join(', ') + '. '
      : ''}Forestry activity near an indicated reach is restricted during the
    spawning window — factor it into harvest scheduling.</p>
  </div>` }

  <div class="card">
    <h3>Water</h3>
    <dl>${kv('Mapped watercourse on title', fmt(C.river_km_on_property, 2) + ' km')}
    ${BL.length > 1 ? BL.map(b => kv(b.name, fmt(b.river_km, 2) + ' km')).join('') : ''}</dl>
    ${NARR.water_note ? `<p class="note">${NARR.water_note}</p>` : ''}
  </div>`;

/* --- data room ---
   The internal build links straight to the file on disk. The shared build
   has no such path to link to, and the documents themselves are not
   embedded (the Artifact sandbox blocks downloads outright), so it lists
   what exists and routes the request to the agents. */
const DR = window.PROPMAP_DATAROOM;

/* Contact agent: the first contact in property.json is the lead; the rest
   are cc'd so an enquiry reaches the whole team. */
(() => {
  const cs = DR.contact || [];
  const c = cs[0];
  if (!c) return;
  const subj = encodeURIComponent(`Enquiry: ${P.name}`);
  const body = encodeURIComponent(`Hi ${c.name.split(' ')[0]},\n\nI'd like to know more about ${P.name}.\n\n`);
  const cc = cs.slice(1).map(x => x.email).filter(Boolean).join(',');
  const href = `mailto:${c.email}?subject=${subj}${cc ? '&cc=' + cc : ''}&body=${body}`;
  const tel = (c.phone || '').replace(/[^\d+]/g, '');
  const shown = (c.phone || '').replace(/^\+64\s?/, '0');   // 021 … reads better locally; tel: keeps +64
  const html = `<a class="mail" href="${href}" title="Email ${c.name}">&#9993;&#xFE0E; Contact agent</a>`
    + (c.phone ? `<a class="tel" href="tel:${tel}" title="Call ${c.name}">&#9742;&#xFE0E; ${shown}</a>` : '');
  ['contacthdr', 'contactfab'].forEach(id => { document.getElementById(id).innerHTML = html; });
  const fc = document.getElementById('footcontact');
  if (fc && c.phone) fc.innerHTML = ` &middot; ${c.name} <a href="tel:${tel}" style="color:var(--ink);white-space:nowrap">${shown}</a>`;
})();
const LINKED = !STATIC_AERIAL;
/* Hosted build with a gated data room: every buyer document carries an
   href under dataroom/, which Cloudflare Access puts behind a one-time
   email code. The page itself stays public. */
const GATED = !!DR.gated;

const EXT_COLOUR = {
  PDF: '#e03131', XLSX: '#2f9e44', CSV: '#2f9e44', DOCX: '#4dabf7',
  SHP: '#f59f00', FI2: '#ae3ec9', MSG: '#868e96', INDD: '#868e96', PNG: '#868e96',
};

function docRow(d) {
  const colour = EXT_COLOUR[d.ext] || 'var(--sage)';
  const label = (LINKED || (GATED && d.href))
    ? `<a href="${d.href}" target="_blank" rel="noopener">${d.name}</a>`
    : d.name;
  return `<div class="doc">
    <i class="ext" style="background:${colour}22;color:${colour};border-color:${colour}55">${d.ext}</i>
    <div class="docmeta">
      <div class="docname">${label}${
        d.visibility === 'internal' ? ' <b class="int">internal</b>' : ''}</div>
      <div class="docsub">${d.size} · ${d.modified}${d.note ? ' · ' + d.note : ''}</div>
    </div>
  </div>`;
}

const visible = DR.documents.filter(d => LINKED || d.visibility === 'buyer');
const byCat = c => visible.filter(d => d.category === c);

document.getElementById('pane-docs').innerHTML = `
  <div class="card">
    <h3>Data room</h3>
    <div class="big">${fmt(visible.length)}<small> documents</small></div>
    <p class="note" style="margin-top:7px">${
      LINKED
        ? 'Click any document to open it from the property folder. Items marked '
          + '<b class="int">internal</b> are commercial and are withheld from the '
          + 'shared copy of this map.'
        : GATED
        ? (visible.length
          ? 'Documents are released to registered parties. Click a document and '
            + 'sign in with the email address you registered with; a one-time code '
            + 'is emailed to you and no password is needed. Not registered yet? '
            + 'Contact the agents below.'
          : 'The due-diligence pack is being assembled. Register your interest with '
            + 'the agents below to receive access as it is released.')
        : (visible.length
          ? 'The full pack is released to registered parties on request. Contact '
            + 'the agents below and we will provide access.'
          : 'The due-diligence pack is being assembled. Register your interest with '
            + 'the agents below to receive it as it is released.')}</p>
    <p class="note">Indexed ${DR.generated}.</p>
  </div>

  ${DR.categories.map(c => {
    const rows = byCat(c);
    if (!rows.length) return '';
    return `<div class="card">
      <h3>${c} <span style="float:right;color:var(--ink3)">${rows.length}</span></h3>
      ${rows.map(docRow).join('')}
    </div>`;
  }).join('')}

  <div class="card">
    <h3>${LINKED ? 'Agents' : GATED ? 'Register for access' : 'Request the full pack'}</h3>
    ${DR.contact.map(p => `<div class="doc">
      <div class="docmeta">
        <div class="docname">${p.name}</div>
        <div class="docsub">${p.role}</div>
        <div class="docsub"><a href="mailto:${p.email}">${p.email}</a> · ${p.phone}</div>
      </div></div>`).join('')}
    <p class="note">Searle Agribusiness · Licensed under the Real Estate Agents Act 2008</p>
  </div>`;

/* --- data --- */
document.getElementById('pane-data').innerHTML = `
  <div class="card">
    <h3>Sources &amp; caveats</h3>
    <ul class="notes">${STATS.data_notes.map(n => `<li>${n}</li>`).join('')}</ul>
  </div>
  <div class="card">
    <h3>Layers loaded</h3>
    <table class="mini"><tbody>
      ${DEFS.filter(d => !d.grp && !d.empty).map(d => {
        const src = d.k === '__photos' ? PHOTOS : LAYERS[d.k];
        return `<tr><td>${d.n}</td><td>${fmt(src.features.length)}</td></tr>`;
      }).join('')}
    </tbody></table>
  </div>
  <div class="card">
    <h3>Refreshing</h3>
    <p class="note" style="margin-top:0">LINZ refreshes parcels weekly. To pull current
    data and cut a new version of this map:</p>
    <p class="note" style="font-family:ui-monospace,Consolas,monospace;color:var(--ink2)">
    python scripts/release.py --refresh --note "..."</p>
    <p class="note">Built 13 October 2026.</p>
  </div>`;
</script>
</body>
</html>
